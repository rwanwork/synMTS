$schema: "http://json-schema.org/draft-06/schema#"

description:  Snakemake configuration file

type: object


properties:
  generate:
    description:  Various options related to the "generate" workflow
    type:  object
    items:
      type:  string
  statistics:
    description:  Various options related to the "statistics" workflow
    type:  object
    items:
      type:  string
  select:
    description:  Various options related to the "select" workflow
    type:  object
    items:
      type:  string
  replicates:
    description:  Various options related to the generation of replicates
    type:  object
    items:
      type:  string
  protein:
    description:  Set of sequences to append
    type:  object
    items:
      type:  string
